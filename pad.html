<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#14322e">
<title>Джойстик · Құпия есік</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#14322e; --bg2:#0f2622; --ink:#f4ead8; --dim:#b9b09a; --ochre:#e3a63b; --red:#c4553a;
  --line:rgba(244,234,216,.16); --me:#3d8bd9;
  --f:"Rubik","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--f);overflow:hidden;overscroll-behavior:none}
body{display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
[hidden]{display:none!important}

header{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:2px dashed var(--line)}
.badge{width:44px;height:44px;border-radius:50%;background:var(--me);display:grid;place-items:center;font-weight:800;font-size:22px;color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.who{flex:1;line-height:1.15}
.who b{display:block;font-size:17px}
.who small{color:var(--dim);font-size:13px}
.dot{width:12px;height:12px;border-radius:50%;background:#777}
.dot.on{background:#6fcf5a;box-shadow:0 0 0 4px rgba(111,207,90,.18)}
.dot.off{background:var(--red)}

#info{padding:14px 16px 6px;min-height:92px}
#msg{font-size:18px;font-weight:600;line-height:1.3;text-wrap:balance}
#hold{margin-top:10px;display:inline-flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:2px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:600}
#timer{float:right;font-weight:800;font-size:20px;font-variant-numeric:tabular-nums;color:var(--ochre)}

#lobby{flex:1;padding:8px 16px 16px;display:flex;flex-direction:column;gap:12px}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode{border:2px solid var(--line);background:var(--bg2);color:var(--ink);border-radius:12px;padding:14px 10px;font:600 16px var(--f);text-align:left}
.mode span{display:block;font-size:12px;color:var(--dim);font-weight:400;margin-top:4px}
.mode.sel{border-color:var(--ochre);background:#2a3f2c}
.big{border:0;border-radius:12px;background:var(--ochre);color:#2a1d08;font:800 20px var(--f);padding:16px;box-shadow:0 4px 0 #9b6c1a}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #9b6c1a}
.big:disabled{opacity:.45}
.note{color:var(--dim);font-size:14px;line-height:1.4}

#pad{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px 12px 14px;min-height:0}
.zone{position:relative;border-radius:16px;touch-action:none}
#joy{background:radial-gradient(circle at 50% 60%,rgba(244,234,216,.06),transparent 70%);border:2px dashed var(--line)}
#ring{position:absolute;left:50%;top:60%;width:150px;height:150px;margin:-75px 0 0 -75px;border-radius:50%;border:3px solid rgba(244,234,216,.28);pointer-events:none}
#knob{position:absolute;left:50%;top:50%;width:62px;height:62px;margin:-31px 0 0 -31px;border-radius:50%;background:var(--me);box-shadow:0 4px 0 rgba(0,0,0,.4),inset 0 -6px 0 rgba(0,0,0,.18)}
.right{display:flex;flex-direction:column;gap:10px;min-height:0}
#look{flex:1;background:repeating-linear-gradient(0deg,transparent 0 23px,rgba(244,234,216,.05) 23px 24px),repeating-linear-gradient(90deg,transparent 0 23px,rgba(244,234,216,.05) 23px 24px);border:2px dashed var(--line);display:grid;place-items:center;color:var(--dim);font-size:13px;text-align:center}
.lbl{position:absolute;left:0;right:0;bottom:8px;text-align:center;color:var(--dim);font-size:12px;pointer-events:none}
.row{display:flex;gap:10px}
#act{flex:1;min-height:76px;border:0;border-radius:16px;background:var(--ochre);color:#2a1d08;font:800 22px var(--f);box-shadow:0 5px 0 #9b6c1a;touch-action:manipulation}
#act.idle{background:#3a4f48;color:var(--dim);box-shadow:0 5px 0 #233530}
#act:active{transform:translateY(4px);box-shadow:0 1px 0 #9b6c1a}
#crouch{width:76px;border:2px solid var(--line);border-radius:16px;background:var(--bg2);color:var(--ink);font:600 13px var(--f)}
#crouch.on{background:var(--me);border-color:transparent;color:#fff}

#kp{position:fixed;inset:0;background:rgba(10,24,21,.94);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px;z-index:5}
#kp h2{margin:0;font-size:20px}
.boxes{display:flex;gap:10px}
.boxes i{width:52px;height:64px;border-radius:10px;border:3px solid var(--ochre);display:grid;place-items:center;font:800 32px var(--f);font-style:normal;background:#0b1d1a}
.keys{display:grid;grid-template-columns:repeat(3,78px);gap:10px}
.keys button{height:64px;border:0;border-radius:12px;background:#f4ead8;color:#1d2b28;font:800 26px var(--f);box-shadow:0 4px 0 #a99f8a}
.keys button:active{transform:translateY(3px);box-shadow:0 1px 0 #a99f8a}
.keys .ok{background:#6fcf5a;box-shadow:0 4px 0 #3e8f2f}
#kpClose{background:none;border:0;color:var(--dim);font:600 16px var(--f);text-decoration:underline}
#kpRes{min-height:22px;font-weight:600}

#conn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ochre);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (orientation:landscape) and (max-height:500px){
  #info{min-height:0;padding:8px 16px}
  #msg{font-size:15px}
  header{padding:6px 16px}
}
</style>
</head>
<body>
<header>
  <div class="badge" id="badge">?</div>
  <div class="who"><b id="whoName">Қосылуда…</b><small id="whoSub">Құпия есік · джойстик</small></div>
  <div class="dot" id="dot"></div>
</header>

<section id="conn">
  <div class="spin"></div>
  <p id="connText">Панельге қосылып жатырмын…</p>
</section>

<div id="info" hidden>
  <span id="timer"></span>
  <div id="msg"></div>
  <div id="hold" hidden></div>
</div>

<section id="lobby" hidden>
  <div id="lobbyLead">
    <p class="note">Ойын түрін таңда да, «Бастау» бас. Екінші ойыншы да QR-кодты сканерлей алады.</p>
    <div class="modes">
      <button class="mode" data-mode="quest">Квест<span>Заттарды жинап, есіктің кодын тап</span></button>
      <button class="mode" data-mode="hide">Жасырынбақ<span>Біреуі тығылады, біреуі іздейді</span></button>
    </div>
  </div>
  <button class="big" id="startBtn">Бастау</button>
  <p class="note" id="lobbyNote"></p>
</section>

<section id="pad" hidden>
  <div class="zone" id="joy"><div id="ring"><div id="knob"></div></div><div class="lbl">Жүру</div></div>
  <div class="right">
    <div class="row">
      <button id="act" class="idle">—</button>
      <button id="crouch" hidden>Отыру</button>
    </div>
    <div class="zone" id="look">саусақпен сүйре —<br>жан-жаққа қара</div>
  </div>
</section>

<div id="kp" hidden>
  <h2>Есіктің коды</h2>
  <div class="boxes"><i></i><i></i><i></i><i></i></div>
  <div id="kpRes"></div>
  <div class="keys">
    <button>1</button><button>2</button><button>3</button>
    <button>4</button><button>5</button><button>6</button>
    <button>7</button><button>8</button><button>9</button>
    <button data-k="del">⌫</button><button>0</button><button data-k="ok" class="ok">✓</button>
  </div>
  <button id="kpClose">Жабу</button>
</div>

<script src="mqtt.min.js"></script>
<script src="net.js"></script>
<script>
const $ = id => document.getElementById(id);
const q = new URLSearchParams(location.search);
const ROOM = (q.get('r') || '').toUpperCase();

/* телефонның тұрақты белгісі: бетті жаңартса да сол ойыншы болып қалады */
let PID;
try { PID = sessionStorage.getItem('qk_pid_' + ROOM); } catch (e) {}
if (!PID) { PID = Math.random().toString(36).slice(2, 10); try { sessionStorage.setItem('qk_pid_' + ROOM, PID); } catch (e) {} }

let net = null, me = { slot: 0 }, st = {}, selMode = 'quest', lastMsgAt = 0, modeAt = 0;

function buzz(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }
function setDot(s) { $('dot').className = 'dot ' + (s === 'on' ? 'on' : 'off'); }

let connAt = 0;
if (!ROOM) {
  $('connText').textContent = 'Бөлме коды жоқ. Панельдегі QR-кодты қайта сканерле.';
} else {
  net = NET.openPad({
    room: ROOM, pid: PID, onMsg: onMsg,
    onStatus: (s, name) => {
      if (s === 'try') { setDot('off'); if (!me.slot) $('connText').textContent = 'Серверге қосылып жатырмын: ' + name + '…'; }
      if (s === 'on') { connAt = Date.now(); hello(); if (!me.slot) $('connText').textContent = name + ' арқылы панельді іздеп жатырмын…'; }
      if (s === 'off') setDot('off');
    }
  });
}

function hello() { net && net.send({ t: 'hello' }); }
setInterval(() => {
  if (!net || !net.online) return;
  net.send({ t: 'ping' });
  const quiet = Date.now() - Math.max(lastMsgAt, connAt);
  /* панель үнсіз қалса — қайта сәлемдесеміз; ұзақ үнсіз болса — басқа серверге көшеміз */
  if (quiet > 5000) { hello(); if (me.slot) setDot('off'); }
  if (quiet > 9000) { connAt = Date.now(); net.next(); }
}, 2000);

function onMsg(m) {
  lastMsgAt = Date.now();
  if (m.t === 'welcome' && m.pid === PID) {
    me = m;
    document.documentElement.style.setProperty('--me', m.color);
    $('badge').textContent = m.slot;
    $('whoName').textContent = m.slot + '-ойыншы';
    $('whoSub').textContent = 'Бөлме ' + ROOM;
    $('conn').hidden = true; $('info').hidden = false;
    setDot('on'); buzz(40);
  } else if (m.t === 'full' && m.pid === PID) {
    $('connText').textContent = 'Ойында екі ойыншы бар. Біреуі шыққанша күте тұр.';
  } else if (m.t === 'st' && m.pid === PID) {
    render(m);
  } else if (m.t === 'codeRes' && m.pid === PID) {
    if (m.ok) { buzz([60, 40, 60]); closeKp(); }
    else { buzz(300); $('kpRes').textContent = 'Код қате. Тағы ойлан!'; code = ''; drawCode(); }
  } else if (m.t === 'fx' && m.pid === PID) {
    buzz(m.v || 40);
  }
}

function render(s) {
  const prev = st; st = s;
  if (!me.slot) return;
  setDot('on');
  $('msg').textContent = s.msg || '';
  $('timer').textContent = s.timer || '';
  if (s.hold) { $('hold').hidden = false; $('hold').textContent = 'Қолыңда: ' + s.hold; } else $('hold').hidden = true;

  const playing = s.phase === 'play';
  $('pad').hidden = !playing;
  $('lobby').hidden = playing;
  if (!playing) {
    const lead = me.slot === 1;
    $('lobbyLead').hidden = !lead;
    $('startBtn').hidden = !lead;
    $('startBtn').textContent = s.phase === 'end' ? 'Қайта ойнау' : 'Бастау';
    /* өзі жаңа ғана таңдаса — панельдің ескі күйі таңдауды қайтармасын */
    if (s.mode && s.mode !== selMode && Date.now() - modeAt > 2500) { selMode = s.mode; markMode(); }
    $('lobbyNote').textContent = lead
      ? (selMode === 'hide' && s.players < 2 ? 'Жалғыз ойнасаң — компьютер тығылады, сен іздейсің.' : 'Ойыншылар: ' + s.players + ' / 2')
      : 'Бірінші ойыншы ойынды бастайды. Панельге қара!';
    joyReset();
  }
  const a = $('act');
  a.textContent = s.act || '—';
  a.className = s.act ? '' : 'idle';
  $('crouch').hidden = !s.canCrouch;
  $('crouch').classList.toggle('on', !!s.crouch);
  if (s.keypad && !prev.keypad) openKp();
  if (!s.keypad && prev.keypad) closeKp();
}

/* ---------- лобби ---------- */
function markMode() { document.querySelectorAll('.mode').forEach(b => b.classList.toggle('sel', b.dataset.mode === selMode)); }
markMode();
document.querySelectorAll('.mode').forEach(b => b.onclick = () => {
  selMode = b.dataset.mode; modeAt = Date.now(); markMode(); net && net.send({ t: 'mode', mode: selMode });
  if (st.phase) render(st);
});
$('startBtn').onclick = () => {
  net && net.send({ t: 'start', mode: selMode }); buzz(30);
  /* экран сөнбесін */
  try { navigator.wakeLock && navigator.wakeLock.request('screen').catch(() => {}); } catch (e) {}
};

/* ---------- джойстик ---------- */
const joy = { id: null, cx: 0, cy: 0, x: 0, y: 0 };
const look = { id: null, lx: 0, ly: 0, dx: 0, dy: 0 };
const R = 60;
$('joy').addEventListener('pointerdown', e => {
  if (joy.id !== null) return;
  joy.id = e.pointerId; $('joy').setPointerCapture(e.pointerId);
  /* сақина саусақ тиген жерге көшеді */
  const r = $('joy').getBoundingClientRect();
  joy.cx = e.clientX; joy.cy = e.clientY;
  $('ring').style.left = (e.clientX - r.left) + 'px'; $('ring').style.top = (e.clientY - r.top) + 'px';
  joyMove(e);
});
$('joy').addEventListener('pointermove', e => { if (e.pointerId === joy.id) joyMove(e); });
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => $('joy').addEventListener(ev, e => { if (e.pointerId === joy.id) joyReset(); }));
function joyMove(e) {
  let dx = e.clientX - joy.cx, dy = e.clientY - joy.cy;
  const d = Math.hypot(dx, dy);
  if (d > R) { dx *= R / d; dy *= R / d; }
  joy.x = dx / R; joy.y = dy / R;
  $('knob').style.transform = `translate(${dx}px,${dy}px)`;
}
function joyReset() {
  joy.id = null; joy.x = joy.y = 0;
  $('knob').style.transform = '';
  $('ring').style.left = '50%'; $('ring').style.top = '60%';
}

$('look').addEventListener('pointerdown', e => {
  if (look.id !== null) return;
  look.id = e.pointerId; $('look').setPointerCapture(e.pointerId);
  look.lx = e.clientX; look.ly = e.clientY;
});
$('look').addEventListener('pointermove', e => {
  if (e.pointerId !== look.id) return;
  look.dx += e.clientX - look.lx; look.dy += e.clientY - look.ly;
  look.lx = e.clientX; look.ly = e.clientY;
});
['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => $('look').addEventListener(ev, e => { if (e.pointerId === look.id) look.id = null; }));

/* 20 рет/сек панельге жібереміз; қозғалмаса — бір рет нөл жіберіп, үндемейміз */
let wasIdle = true;
setInterval(() => {
  if (!net || !me.slot || st.phase !== 'play') return;
  const idle = !joy.x && !joy.y && !look.dx && !look.dy;
  if (idle && wasIdle) return;
  net.send({ t: 'in', jx: +joy.x.toFixed(2), jy: +joy.y.toFixed(2), dyaw: Math.round(look.dx), dpit: Math.round(look.dy) });
  look.dx = look.dy = 0; wasIdle = idle;
}, 50);

$('act').addEventListener('pointerdown', e => { e.preventDefault(); net && net.send({ t: 'act' }); buzz(15); });
$('crouch').addEventListener('pointerdown', e => { e.preventDefault(); net && net.send({ t: 'crouch' }); buzz(15); });

/* ---------- код енгізу ---------- */
let code = '';
function drawCode() { document.querySelectorAll('.boxes i').forEach((b, i) => b.textContent = code[i] || ''); }
function openKp() { code = ''; drawCode(); $('kpRes').textContent = ''; $('kp').hidden = false; buzz(30); }
function closeKp() { $('kp').hidden = true; }
document.querySelectorAll('.keys button').forEach(b => b.onclick = () => {
  const k = b.dataset.k;
  if (k === 'del') code = code.slice(0, -1);
  else if (k === 'ok') { if (code.length === 4) net.send({ t: 'code', v: code }); else $('kpRes').textContent = 'Төрт сан тер'; }
  else if (code.length < 4) code += b.textContent;
  $('kpRes').textContent = k === 'ok' ? $('kpRes').textContent : '';
  drawCode(); buzz(10);
});
$('kpClose').onclick = () => { closeKp(); net && net.send({ t: 'kpClose' }); };
</script>
</body>
</html>
